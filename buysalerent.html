<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Buy & Sell Properties</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://widget.cloudinary.com/v2.0/global/all.js"></script>
  <style>
    .hidden {
      display: none;
    }

    video,
    img {
      width: 100%;
      height: 200px;
      object-fit: cover;
    }

  </style>
</head>

<body>

  <!-- Header -->
  <header>
    <div id="header"></div>
    <script>
      fetch('header.html')
        .then(response => response.text())
        .then(data => document.getElementById('header').innerHTML = data)
        .catch(error => console.error('Error loading header:', error));
    </script>
  </header>

  <!-- Banner -->
  <div class="inside-banner">
    <div class="container">
      <span class="pull-right"><a href="./">Home</a> / Property To Let And For Sale</span>
    </div>
  </div>

  <div class="container my-4">

    <!-- Toggle Buttons -->
    <div class="d-flex justify-content-center mb-3 gap-2">
      <button id="showBuy" class="btn btn-success w-100">Properties For Sale</button>
      <button id="showSell" class="btn btn-danger w-100">Properties To Let</button>
      <button id="showHostel" class="btn btn-login w-100">Hostels</button>
    </div>

    <!-- Search, Filter, and Sort -->
    <div class="row mb-3">
      <div class="col-md-4">
        <input type="text" id="searchBox" class="form-control" placeholder="Search properties...">
      </div>
      <div class="col-md-4">
        <select id="filterLocation" class="form-control">
          <option value="">Filter by Location</option>
          <option value="Lagos">Lagos</option>
          <option value="Abuja">Abuja</option>
          <option value="Port Harcourt">Port Harcourt</option>
        </select>
      </div>
      <div class="col-md-4">
        <select id="sortPrice" class="form-control">
          <option value="">Sort by Price</option>
          <option value="low">Low to High</option>
          <option value="high">High to Low</option>
        </select>
      </div>
    </div>

    <!-- Property Sections -->
    <section id="buySection">
      <h3 class="text-center text-success">Properties For Sale</h3>
      <div class="row property-list"></div>
    </section>

    <section id="sellSection" class="hidden">
      <h3 class="text-center text-danger">Properties To Let</h3>
      <div class="row property-list"></div>
    </section>

    <section id="hostelSection" class="hidden">
      <h3 class="text-center text-info">Hostels</h3>
      <div class="row property-list"></div>
    </section>
  </div>

  <!-- Footer -->
  <footer>
    <div id="footer"></div>
    <script>
      fetch('footer.html')
        .then(response => response.text())
        .then(data => document.getElementById('footer').innerHTML = data)
        .catch(error => console.error('Error loading footer:', error));
    </script>
  </footer>

  <!-- Script to Populate Properties -->
  <script>
    fetch('/api/properties')
      .then(res => res.json())
      .then(response => {
        if (response.status === "success") {
          const properties = response.data;

          const buyList = document.querySelector('#buySection .property-list');
          const sellList = document.querySelector('#sellSection .property-list');
          const hostelList = document.querySelector('#hostelSection .property-list');

          properties.forEach(property => {
            const card = document.createElement('div');
            card.className = 'col-md-4 property-item mb-4';
            card.dataset.price = property.price;
            card.dataset.location = property.location;

            const mediaHTML = property.images && property.images.length > 0
              ? `<img src="${property.images[0]}" class="card-img-top" alt="Property Image">`
              : `<img src="https://via.placeholder.com/300x200?text=No+Image" class="card-img-top" alt="No image">`;

            const priceLabel = property.type === 'sale' ? 'Price' : 'Negotiable Price';

            card.innerHTML = `
              <div class="card">
                ${mediaHTML}
                <div class="card-body">
                  <h5 class="card-title">${property.title}</h5>
                  <p class="card-text"><strong>Location:</strong> ${property.location}</p>
                  <p class="card-text"><strong>${priceLabel}: ₦${property.price.toLocaleString()}</strong></p>
                  <button class="btn btn-primary mb-2" onClick="window.location.href='https://forms.gle/hJ18vTv6KZT1yaeV9'">Make Enquiry</button>
                </div>
              </div>
            `;

            if (property.type === 'sale') {
              buyList.appendChild(card);
            } else if (property.type === 'rent') {
              sellList.appendChild(card);
            } else if (property.type === 'hostel') {
              hostelList.appendChild(card);
            }
          });
        } else {
          alert("Failed to load properties.");
        }
      })
      .catch(error => {
        console.error("Error fetching properties:", error);
        alert("An error occurred while loading properties.");
      });
  </script>

  <!-- Interactivity Scripts -->
  <script>
    const buySection = document.getElementById("buySection");
    const sellSection = document.getElementById("sellSection");
    const hostelSection = document.getElementById("hostelSection");

    function showOnly(sectionId) {
      buySection.classList.add("hidden");
      sellSection.classList.add("hidden");
      hostelSection.classList.add("hidden");

      document.getElementById(sectionId).classList.remove("hidden");
    }

    document.getElementById("showBuy").addEventListener("click", () => {
      showOnly("buySection");
    });

    document.getElementById("showSell").addEventListener("click", () => {
      showOnly("sellSection");
    });

    document.getElementById("showHostel").addEventListener("click", () => {
      showOnly("hostelSection");
    });

    document.getElementById("searchBox").addEventListener("input", function () {
      let searchValue = this.value.toLowerCase();
      document.querySelectorAll(".property-item").forEach(item => {
        let title = item.querySelector(".card-title").textContent.toLowerCase();
        item.style.display = title.includes(searchValue) ? "block" : "none";
      });
    });

    document.getElementById("filterLocation").addEventListener("change", function () {
      let filterValue = this.value;
      document.querySelectorAll(".property-item").forEach(item => {
        let location = item.dataset.location;
        item.style.display = filterValue === "" || location === filterValue ? "block" : "none";
      });
    });

    document.getElementById("sortPrice").addEventListener("change", function () {
      let sortValue = this.value;
      const sortItems = (items, container) => {
        items.sort((a, b) => {
          let priceA = parseInt(a.dataset.price);
          let priceB = parseInt(b.dataset.price);
          return sortValue === "low" ? priceA - priceB : priceB - priceA;
        });
        items.forEach(item => container.appendChild(item));
      };

      sortItems(
        Array.from(document.querySelectorAll("#buySection .property-item")),
        document.querySelector("#buySection .property-list")
      );
      sortItems(
        Array.from(document.querySelectorAll("#sellSection .property-item")),
        document.querySelector("#sellSection .property-list")
      );
      sortItems(
        Array.from(document.querySelectorAll("#hostelSection .property-item")),
        document.querySelector("#hostelSection .property-list")
      );
    });

    function showSectionFromHash() {
      const hash = window.location.hash;

      switch (hash) {
        case "#sale":
          showOnly("buySection");
          break;
        case "#rent":
          showOnly("sellSection");
          break;
        case "#hostel":
          showOnly("hostelSection");
          break;
        default:
          showOnly("buySection"); // default
      }
    }

    window.addEventListener("DOMContentLoaded", showSectionFromHash);
    window.addEventListener("hashchange", showSectionFromHash);
  </script>

</body>

</html>
