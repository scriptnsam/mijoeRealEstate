<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In & Register</title>

  <!-- Bootstrap 5 CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background-color: #f4f4f4;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }

    .container {
      max-width: 380px;
      position: relative;
    }

    .form-container {
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0px 5px 15px rgba(0, 0, 0, 0.2);
      text-align: center;
      position: relative;
    }

    .form-container h2 {
      font-weight: bold;
      margin-bottom: 20px;
    }

    .form-control {
      padding: 10px;
      font-size: 16px;
    }

    .toggle-btn {
      background: none;
      color: #007bff;
      text-decoration: underline;
      border: none;
      cursor: pointer;
      font-size: 14px;
      margin-top: 10px;
    }

    .toggle-btn:hover {
      text-decoration: none;
    }

    .home-btn {
      position: absolute;
      top: 10px;
      right: 15px;
      background: none;
      border: none;
      font-size: 18px;
      color: #007bff;
      cursor: pointer;
    }

    .home-btn:hover {
      color: #0056b3;
    }

    .emoji {
      font-size: 22px;
    }

  </style>
</head>

<body>

  <div class="container">
    <div class="form-container">
      <!-- Back to Home Button -->
      <button class="home-btn" onclick="goHome()" style="font-size: smaller;">
        < Back To Home</button>

          <h2 id="form-title">Create an Account</h2>

          <!-- Register Form -->
          <form id="register-form" method="POST">
            <div class="mb-3">
              <input type="text" class="form-control" id="fullname" placeholder="Full Name" required>
            </div>
            <div class="mb-3">
              <input id="email" type="email" class="form-control" placeholder="Enter Email" required>
            </div>
            <div class="mb-3">
              <input id="phoneNumber" type="tel" class="form-control" placeholder="Phone Number" required>
            </div>
            <div class="mb-3">
              <input type="password" id="password" class="form-control" placeholder="Password" required>
            </div>
            <div class="mb-3">
              <input type="password" id="confirmPassword" class="form-control" placeholder="Confirm Password" required>
            </div>
            <button type="submit" id="registerBtn" class="btn btn-success w-100">Register</button>
          </form>

          <!-- Sign In Form -->
          <form id="login-form" style="display: none;">
            <div class="mb-3">
              <input type="email" class="form-control" placeholder="Enter Email" id="loginEmail" required>
            </div>
            <div class="mb-3">
              <input type="password" class="form-control" placeholder="Password" id="loginPass" required>
            </div>
            <button type="submit" id="loginBtn" class="btn btn-primary w-100">Sign In</button>
          </form>

          <!-- Toggle Button -->
          <button class="toggle-btn d-block mx-auto" onclick="toggleForms()">Already have an account? Sign In</button>
    </div>
  </div>

  <!-- Bootstrap JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    function toggleForms() {
      const registerForm = document.getElementById("register-form");
      const loginForm = document.getElementById("login-form");
      const formTitle = document.getElementById("form-title");
      const toggleBtn = document.querySelector(".toggle-btn");

      if (registerForm.style.display === "none") {
        registerForm.style.display = "block";
        loginForm.style.display = "none";
        formTitle.innerText = "Create an Account";
        toggleBtn.innerText = "Already have an account? Sign In";
      } else {
        registerForm.style.display = "none";
        loginForm.style.display = "block";
        formTitle.innerText = "Sign In";
        toggleBtn.innerText = "Don't have an account? Register";
      }
    }

    function goHome() {
      window.location.href = "../"; // Change to your actual home page
    }

    document.getElementById("register-form").addEventListener("submit", function (e) {
      e.preventDefault();

      document.getElementById('registerBtn').innerText = "Loading..."

      const formData = {
        email: document.getElementById("email").value,
        password: document.getElementById("password").value,
        confirmPassword: document.getElementById("confirmPassword").value,
        password: document.getElementById("password").value,
        fullname: document.getElementById("fullname").value,
        phoneNumber: document.getElementById("phoneNumber").value,
      };

      fetch("/api/auth/register", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(formData)
      })
        .then(response => response.json())
        .then(data => {
          alert(data.message);
        })
        .catch(error => console.error("Error:", error));


      document.getElementById('registerBtn').innerText = "Register"
    });

    document.getElementById("login-form").addEventListener("submit", function (e) {
      e.preventDefault();


      document.getElementById('loginBtn').innerText = "Loading..."

      const formData = {
        email: document.getElementById("loginEmail").value,
        password: document.getElementById("loginPass").value
      };

      fetch("/api/auth/login", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(formData)
      })
        .then(response => response.json())
        .then(data => {
          alert(data.message)
          if (data.code === 200) {
            // Redirect to dashboard
            window.location.href = "../"
          }
        })
        .catch(error => console.error("Error:", error));


      document.getElementById('loginBtn').innerText = "Sign In"
    });
  </script>

</body>

</html>
