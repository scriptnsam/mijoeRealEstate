<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin – Messages</title>
  <link rel="stylesheet" href="../assets/output.css">
  <script src="../assets/myscript.js"></script>
</head>

<body class="bg-gray-100 min-h-screen flex">

  <!-- Sidebar -->
  <aside class="w-64 bg-white shadow-lg hidden md:flex flex-col">
    <div class="p-6 text-xl font-bold text-gray-800 border-b">Admin Panel</div>
    <nav class="flex-1 p-4 space-y-2 text-gray-700">
      <a href="./dashboard.html" class="flex items-center px-4 py-2 rounded-lg hover:bg-blue-100">
        <svg class="w-5 h-5 mr-3 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M3 12l2-2m0 0l7-7 7 7M13 5v6h6m-6 0H7v6h10v-6H7" />
        </svg>
        Dashboard
      </a>
      <a href="./dashboard.html" class="flex items-center px-4 py-2 rounded-lg hover:bg-blue-100">
        <svg class="w-5 h-5 mr-3 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M4 16v1a1 1 0 001 1h3m10-2h3a1 1 0 001-1v-1m-6-4v6m0-6l-2 2m2-2l2 2M9 21h6" />
        </svg>
        Upload Property
      </a>
      <a href="./manage-properties.html" class="flex items-center px-4 py-2 rounded-lg hover:bg-blue-100">
        <svg class="w-5 h-5 mr-3 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M3 7l9 4 9-4-9-4-9 4zM3 17l9 4 9-4M3 12l9 4 9-4" />
        </svg>
        Manage Properties
      </a>
      <a href="./users.html" class="flex items-center px-4 py-2 rounded-lg hover:bg-blue-100">
        <svg class="w-5 h-5 mr-3 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M17 20h5v-2a4 4 0 00-3-3.87M9 20H4v-2a4 4 0 013-3.87m6 5.87v-6a4 4 0 10-8 0v6m8-6a4 4 0 118 0v6" />
        </svg>
        Users
      </a>
      <a href="./messages.html" class="flex items-center px-4 py-2 rounded-lg bg-blue-100 text-blue-700">
        <svg class="w-5 h-5 mr-3 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M8 10h.01M12 10h.01M16 10h.01M21 12c0 1.657-1.343 3-3 3H6l-3 3V6c0-1.657 1.343-3 3-3h12c1.657 0 3 1.343 3 3v6z" />
        </svg>
        Messages
      </a>
    </nav>
  </aside>

  <!-- Main Content -->
  <main class="flex-1 p-6 overflow-y-auto">
    <h1 class="text-3xl font-semibold text-gray-800 mb-6 flex items-center">
      <svg class="w-7 h-7 text-blue-600 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M8 10h.01M12 10h.01M16 10h.01M21 12c0 1.657-1.343 3-3 3H6l-3 3V6c0-1.657 1.343-3 3-3h12c1.657 0 3 1.343 3 3v6z" />
      </svg>
      Messages
    </h1>

    <div id="messagesContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      <!-- Message cards will appear here -->
    </div>
  </main>

  <script>
    async function fetchMessages() {
      try {
        const res = await fetch('/api/messages'); // Replace with your endpoint
        const json = await res.json();


        if (json.status === 'success') {
          displayMessages(json.data);
        } else if (json.code === 404) {
          displayMessages([]);
        } else {
          alert('Failed to fetch messages');
        }
      } catch (error) {
        console.error(error);
        alert('An error occurred while fetching messages');
      }
    }

    function formatDate(dateStr) {
      const date = new Date(dateStr);
      return date.toLocaleDateString() + ' • ' + date.toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'});
    }

    function displayMessages(messages) {
      const container = document.getElementById('messagesContainer');
      container.innerHTML = '';

      if (messages.length === 0) {
        container.innerHTML = '<p class="text-gray-500 col-span-full">No messages found.</p>';
        return;
      }

      messages.forEach(msg => {
        const card = document.createElement('div');
        card.className = "bg-white rounded-lg shadow hover:shadow-xl transition p-5 border border-gray-200";

        card.innerHTML = `
          <div class="flex justify-between items-center mb-3">
            <h2 class="text-lg font-semibold text-gray-800 flex items-center">
              <svg class="w-5 h-5 mr-2 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.121 17.804A13.937 13.937 0 0112 15c2.295 0 4.435.516 6.354 1.426M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
              </svg>${msg.name}
            </h2>
            <span class="text-sm text-gray-400 flex items-center">
              <svg class="w-4 h-4 mr-1 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
              </svg>
              ${formatDate(msg.submittedAt)}
            </span>
          </div>

          <p class="text-sm text-gray-700 mb-1 flex items-center">
            <svg class="w-4 h-4 mr-2 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 12h2a2 2 0 002-2V6a2 2 0 00-2-2h-2M8 12H6a2 2 0 01-2-2V6a2 2 0 012-2h2m2 0h4" />
            </svg>
            ${msg.email}
          </p>

          <p class="text-sm text-gray-700 mb-4 flex items-center">
            <svg class="w-4 h-4 mr-2 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5h2l3 7-1.293 2.707A1 1 0 007 16h10a1 1 0 00.707-1.707L17 12l3-7H3z" />
            </svg>
            ${msg.phone}
          </p>

          <div class="bg-gray-50 p-4 rounded border border-gray-200 text-gray-800 whitespace-pre-line text-sm">
            ${msg.message}
          </div>
        `;

        container.appendChild(card);
      });
    }

    fetchMessages();
  </script>
</body>

</html>
