<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard</title>
  <link rel="stylesheet" href="../assets/output.css">
  <script src="../assets/myscript.js"></script>

  <link rel="stylesheet" href="https://unpkg.com/@fortawesome/fontawesome-free/css/all.min.css" />
</head>

<body class="bg-gray-100 min-h-screen flex">

  <!-- Sidebar -->
  <aside class="w-64 bg-white border-r shadow-sm hidden md:block">
    <div class="p-6 text-xl font-bold text-gray-800 border-b">
      Admin Panel
    </div>
    <nav class="p-4 space-y-2 text-gray-700">
      <a href="#" class="flex items-center px-4 py-2 rounded-lg bg-blue-100 text-blue-700">
        <i class="fas fa-chart-line mr-3"></i> Dashboard
      </a>
      <a href="./manage-properties.html" class="flex items-center px-4 py-2 rounded-lg hover:bg-gray-100">
        <i class="fas fa-home mr-3"></i> Manage Properties
      </a>
      <a href="./users.html" class="flex items-center px-4 py-2 rounded-lg hover:bg-gray-100">
        <i class="fas fa-users mr-3"></i> Users
      </a>
      <a href="./messages.html" class="flex items-center px-4 py-2 rounded-lg
          hover:bg-gray-100">
        <svg class="w-5 h-5 mr-3 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M8 10h.01M12 10h.01M16 10h.01M21 12c0 1.657-1.343 3-3 3H6l-3 3V6c0-1.657 1.343-3 3-3h12c1.657 0 3 1.343 3 3v6z" />
        </svg> Messages
      </a>

    </nav>
  </aside>

  <!-- Main Content -->
  <main class="flex-1 p-6">
    <div class="flex justify-between items-center mb-6">
      <h1 class="text-2xl font-semibold text-gray-800">Dashboard</h1>
      <button class="bg-red-500 hover:bg-red-600 text-white px-4 py-2
          rounded-lg" onclick="logout()">
        <i class="fas fa-sign-out-alt mr-2"></i>Logout
      </button>
    </div>

    <!-- Upload Property Form -->
    <div class="bg-white rounded-lg shadow-lg p-6">
      <h2 class="text-xl font-semibold mb-4 text-gray-700">Upload New Property</h2>

      <form class="grid grid-cols-1 md:grid-cols-2 gap-4" id="propertyForm">
        <div>
          <label class="block text-sm text-gray-600 mb-1">
            <i class="fas fa-heading mr-1"></i>Title
          </label>
          <input type="text" name="title" class="w-full border px-3 py-2 rounded-lg" required />
        </div>

        <div>
          <label class="block text-sm text-gray-600 mb-1">
            <i class="fas fa-money-bill mr-1"></i>Price (₦)
          </label>
          <input type="number" name="price" class="w-full border px-3 py-2 rounded-lg" required />
        </div>

        <div>
          <label class="block text-sm text-gray-600 mb-1">
            <i class="fas fa-tags mr-1"></i>Type
          </label>
          <select name="type" class="w-full border px-3 py-2 rounded-lg" required>
            <option value="rent">Rent</option>
            <option value="sale">Sale</option>
            <option value="hostel">Hostel</option>
          </select>
        </div>

        <div>
          <label class="block text-sm text-gray-600 mb-1">
            <i class="fas fa-layer-group mr-1"></i>Category
          </label>
          <select name="category" class="w-full border px-3 py-2 rounded-lg" required>
            <option value="apartment">Apartment</option>
            <option value="house">House</option>
            <option value="land">Land</option>
            <option value="hostel">Hostel</option>
          </select>
        </div>

        <div class="md:col-span-2">
          <label class="block text-sm text-gray-600 mb-1">
            <i class="fas fa-map-marker-alt mr-1"></i>Location
          </label>
          <input type="text" name="location" class="w-full border px-3 py-2 rounded-lg" required />
        </div>

        <div class="md:col-span-2">
          <label class="block text-sm text-gray-600 mb-1">
            <i class="fas fa-info-circle mr-1"></i>Description
          </label>
          <textarea name="description" rows="4" class="w-full border px-3 py-2 rounded-lg"></textarea>
        </div>

        <div class="md:col-span-2">
          <label class="block text-sm text-gray-600 mb-1">
            <i class="fas fa-image mr-1"></i>Images (Multiple)
          </label>
          <input type="file" name="images" id="images" multiple class="w-full border px-3 py-2 rounded-lg" />
        </div>

        <div class="md:col-span-2 text-right">
          <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-lg">
            <i class="fas fa-upload mr-2"></i>Submit Property
          </button>
        </div>
      </form>

      <!-- Success/Error Message -->
      <p id="message" class="mt-4 text-sm font-medium"></p>
    </div>
  </main>

  <!-- JavaScript to handle form submission -->
  <script>
    const form = document.getElementById('propertyForm');
    const message = document.getElementById('message');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      message.textContent = 'Uploading...';
      message.className = 'mt-4 text-blue-600';

      const formData = new FormData(form);
      const images = document.getElementById('images').files;

      for (let i = 0; i < images.length; i++) {
        formData.append('images', images[i]);
      }

      try {
        const response = await fetch('/api/properties', {
          method: 'POST',
          body: formData,
        });

        const result = await response.json();

        if (response.ok) {
          message.textContent = 'Property uploaded successfully!';
          message.className = 'mt-4 text-green-600';
          form.reset();
        } else {
          message.textContent = result.message || 'Something went wrong!';
          message.className = 'mt-4 text-red-600';
        }
      } catch (error) {
        message.textContent = 'Error uploading property.';
        message.className = 'mt-4 text-red-600';
      }
    });
  </script>

  <script>
    async function logout() {
      const response = await fetch('/api/auth/logout', {
        method: 'GET'
      })

      const res = await response.json();
      if (res.code === 200) {
        window.location.href = './';
      }
    }
  </script>
</body>

</html>
