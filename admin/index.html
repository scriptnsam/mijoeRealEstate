<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login</title>
  <link rel="stylesheet" href="../assets/output.css">
  <style>
    body {
      background-image: url('https://images.unsplash.com/photo-1590608897129-79da63bbd377?auto=format&fit=crop&w=1400&q=80');
      background-size: cover;
      background-position: center;
    }

  </style>
</head>

<body class="flex items-center justify-center min-h-screen backdrop-blur-sm bg-black/40">

  <div class="bg-white/90 rounded-2xl shadow-xl p-8 sm:p-12 w-full max-w-md">
    <h2 class="text-2xl font-bold text-center text-gray-800 mb-6">Admin Panel Login</h2>

    <!-- Alert Placeholder -->
    <div id="alert" class="hidden mb-4 p-3 rounded text-white text-sm font-medium"></div>

    <form id="loginForm" class="space-y-5">
      <div>
        <label for="email" class="block text-sm font-medium text-gray-700">Email address</label>
        <input type="email" id="email" name="email" required
          class="mt-1 w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>

      <div>
        <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
        <input type="password" id="password" name="password" required
          class="mt-1 w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>

      <div class="flex items-center justify-between">
        <label class="flex items-center space-x-2">
          <input type="checkbox" class="form-checkbox rounded text-blue-500">
          <span class="text-sm text-gray-600">Remember me</span>
        </label>
        <a href="#" class="text-sm text-blue-600 hover:underline">Forgot password?</a>
      </div>

      <button type="submit"
        class="w-full py-2 px-4 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-lg transition duration-200">
        Sign In
      </button>
    </form>

    <p class="mt-6 text-sm text-center text-gray-600">
      Not an admin? <a href="/" class="text-blue-600 hover:underline">Go Home</a>
    </p>
  </div>

  <script>
    const form = document.getElementById("loginForm");
    const alertBox = document.getElementById("alert");

    form.addEventListener("submit", async function (e) {
      e.preventDefault();

      const email = form.email.value.trim();
      const password = form.password.value.trim();

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({email, password}),
        });

        const data = await res.json();

        if (!res.ok) {
          showAlert(data.message || "Login failed", "red");
          return;
        }


        if (data.data.user.role !== "admin") {
          return showAlert(`You are not an admin.\n You have been automatically
logged in as ${data.data.user.role}.`, "red")
        }

        showAlert("Login successful!", "green");
        setTimeout(() => {
          window.location.href = "/admin/dashboard.html"; // change to your dashboard route
        }, 1000);
      } catch (err) {
        showAlert("An error occurred. Try again.", "red");
        console.error(err);
      }
    });

    function showAlert(message, color) {
      alertBox.textContent = message;
      alertBox.className = `block mb-4 p-3 rounded text-white text-sm
font-medium bg-${color}-500`;
    }
  </script>
</body>

</html>
